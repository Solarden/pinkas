{% extends "base.html" %}
{% block title %}pinkas — log in{% endblock %}
{% block main %}
<div class="panel" style="max-width:360px;margin:40px auto">
<h2>Log in</h2>
{% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus></div>
  <button>Log in</button>
</form>
</div>
{% endblock %}
