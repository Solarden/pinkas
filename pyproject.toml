[project]
name = "pinkas"
version = "0.1.0"
description = "A ledger of WoW: Forever characters: bags, professions and estimated rested XP."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
# The development environment only. The server uses the distro's python3 and apt packages, so each
# pin holds the same minor line and dev cannot drift onto an API production lacks.
dependencies = [
    "jinja2>=3.1,<3.2",
    "psycopg2-binary>=2.9,<2.10",
    "alembic>=1.13,<1.14",
    "sqlalchemy>=2.0,<2.1",
    "markdown-it-py>=3.0,<3.1",
    "pydantic>=2.10,<2.11",
]

[tool.uv]
package = false
# pydantic's own dependency, at the minor line the server's apt has (Debian trixie: 0.7.0).
constraint-dependencies = ["annotated-types>=0.7,<0.8"]
# The Windows app's packages: installed here so the tests cover its launcher; the server never has them.
default-groups = ["dev", "desktop"]

[dependency-groups]
desktop = [
    "pixeltable-pgserver==0.6.0",
    "pywebview==6.2.1",
]
dev = [
    "hypothesis>=6.170.5",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
# Ruff only lints: the layout is the author's, and no line is longer.
line-length = 150

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "A", "I"]
